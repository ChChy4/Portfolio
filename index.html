<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- YOUR NAME goes inside <title> -->
  <title></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="hero">
    <h1 class="hero-name"><!-- YOUR NAME --></h1>
    <p class="hero-discipline"><!-- YOUR DISCIPLINE --></p>
    <p class="hero-tagline"><!-- YOUR TAGLINE --></p>
  </header>

  <main>
    <section class="projects" aria-labelledby="projects-heading">
      <h2 id="projects-heading" class="section-label">Projects</h2>
      <ul class="project-grid">
        <li class="project">
          <div class="project-image"><!-- <img src="images/project-1.jpg" alt=""> --></div>
          <h3 class="project-title"><!-- PROJECT 1 TITLE --></h3>
        </li>
        <li class="project">
          <div class="project-image"><!-- <img src="images/project-2.jpg" alt=""> --></div>
          <h3 class="project-title"><!-- PROJECT 2 TITLE --></h3>
        </li>
        <li class="project">
          <div class="project-image"><!-- <img src="images/project-3.jpg" alt=""> --></div>
          <h3 class="project-title"><!-- PROJECT 3 TITLE --></h3>
        </li>
        <li class="project">
          <div class="project-image"><!-- <img src="images/project-4.jpg" alt=""> --></div>
          <h3 class="project-title"><!-- PROJECT 4 TITLE --></h3>
        </li>
      </ul>
    </section>

    <section class="about" aria-labelledby="about-heading">
      <h2 id="about-heading" class="section-label">About</h2>
      <p class="about-bio"><!-- YOUR BIO --></p>
    </section>

    <section class="contact" aria-labelledby="contact-heading">
      <h2 id="contact-heading" class="section-label">Contact</h2>
      <a class="contact-email" href="mailto:"><!-- YOUR EMAIL (also add it after mailto:) --></a>
    </section>
  </main>

</body>
</html>
